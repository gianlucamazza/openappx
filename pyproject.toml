[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openappx"
version = "0.4.0"
description = "Linux-first open-source Appx/MSIX layout validation and packing"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "openappx contributors" }]
keywords = ["msix", "appx", "packaging", "windows", "linux"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "coverage>=7.0"]
# Signature *creation* only; reading, verifying and packing stay stdlib-only.
sign = ["cryptography>=43.0"]

[project.scripts]
openappx = "openappx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["src/openappx"]

[tool.coverage.report]
# The suite covers ~96%; keep it from silently rotting.
fail_under = 90
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
