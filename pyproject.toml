[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openappx"
version = "0.6.2"
description = "Build, sign, bundle and install Windows Appx/MSIX packages from Linux"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Gianluca Mazza", email = "info@gianlucamazza.it" }]
keywords = ["msix", "appx", "packaging", "windows", "linux"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/gianlucamazza/openappx"
Repository = "https://github.com/gianlucamazza/openappx"
Changelog = "https://github.com/gianlucamazza/openappx/blob/main/CHANGELOG.md"
Issues = "https://github.com/gianlucamazza/openappx/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "coverage>=7.0", "mypy>=1.11"]
# Signature *creation* only; reading, verifying and packing stay stdlib-only.
sign = ["cryptography>=43.0"]

[project.scripts]
openappx = "openappx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["src/openappx"]

[tool.coverage.run]
source = ["src/openappx"]

[tool.coverage.report]
# The suite covers ~96%; keep it from silently rotting.
fail_under = 90
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
