version: 2
updates:
  # The audit that produced this file found the actions three major versions
  # behind and the Python matrix missing a release. Automate the noticing.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

    groups:
      version-updates:
        applies-to: version-updates
        patterns: ['*']
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      version-updates:
        applies-to: version-updates
        patterns: ['*']
