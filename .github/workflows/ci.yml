name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Smoke-pack and inspect the example layout
        run: |
          openappx validate --root examples/minimal-layout
          openappx pack --root examples/minimal-layout --out /tmp/example.msix
          openappx inspect --package /tmp/example.msix

      - name: No-install invocation path still works
        run: PYTHONPATH=src python -m openappx.pack --root examples/minimal-layout --out /tmp/nopath.msix
