name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        # [sign] matters: without it tests/test_signer.py skips itself entirely,
        # and the signature builder is the least forgiving code here.
        run: python -m pip install -e ".[dev,sign]"

      - name: Lint
        run: ruff check src tests

      - name: Types
        run: mypy

      - name: Test
        run: coverage run -m pytest -q
        env:
          # Golden tests fetch Microsoft's signed reference packages; a network
          # blip must not turn into a red build.
          OPENAPPX_NO_NETWORK: ${{ matrix.python-version == '3.14' && '' || '1' }}

      - name: Coverage
        # fail_under lives in pyproject.toml, so local runs enforce the same bar.
        run: coverage report

      - name: Fail if the signing tests were skipped
        run: |
          python - <<'PY'
          import cryptography  # noqa: F401  — must be importable for test_signer
          print("cryptography present, signing tests ran")
          PY

      - name: Pack, sign and inspect the example layout
        run: |
          openappx validate --root examples/minimal-layout
          openappx pack --root examples/minimal-layout --out /tmp/example.msix
          openappx inspect --package /tmp/example.msix
          openappx sign --make-test-cert "CN=OpenAppx-Example" --cert-out /tmp/ci
          openappx sign --package /tmp/example.msix --pfx /tmp/ci.pfx
          openappx inspect --package /tmp/example.msix

      - name: No-install invocation path still works
        run: PYTHONPATH=src python -m openappx.pack --root examples/minimal-layout --out /tmp/nopath.msix

      - name: The sdist carries a suite that runs
        # setuptools ships tests/test_*.py by itself but not conftest.py, nor
        # examples/ and docs/ that the tests read — so an sdist can look
        # complete and be untestable. MANIFEST.in fixes that; this proves it.
        if: matrix.python-version == '3.13'
        run: |
          python -m pip install build
          python -m build --sdist --outdir dist .
          mkdir -p /tmp/sdist && tar xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          cd /tmp/sdist && OPENAPPX_NO_NETWORK=1 python -m pytest -q
